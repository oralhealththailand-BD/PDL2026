<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>สถานะการยืนยันสิทธิ์ | ผู้นำทันตกรรมป้องกันระดับปฐมภูมิ</title>
<meta name="description" content="ความคืบหน้าการยืนยันสิทธิ์เข้ารับการอบรมผู้นำด้านทันตกรรมป้องกันในระดับปฐมภูมิ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b1c33; --navy-2:#12305c; --blue:#1c4fd8; --blue-dk:#1740ae; --blue-lt:#4a7cf0;
  --tint:#eef3fd; --tint-2:#dde7fb;
  --silver:#e6eaf1; --silver-2:#ccd4e0; --steel:#f4f6fa;
  --line:#e0e5ee; --line-2:#cfd7e4;
  --ink:#0d1b2e; --muted:#5a6779;
  --info-bg:#f3f7fe;
  --warn:#a86a12; --warn-bg:#fdf5e6;
  --danger:#b42318; --danger-bg:#fdf1f0;
  --ok:#1a7f52; --ok-bg:#eaf6f0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'IBM Plex Sans Thai','Segoe UI',Tahoma,sans-serif;background:var(--steel);
  color:var(--ink);line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased}

.masthead{background:linear-gradient(158deg,var(--navy) 0%,#102a52 58%,var(--navy-2) 100%);
  color:#fff;padding:2rem 1.25rem 1.8rem;position:relative;overflow:hidden}
.masthead::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 1px,transparent 1px 46px);
  pointer-events:none}
.masthead .in{max-width:860px;margin:0 auto;position:relative}
.org{font-size:.82rem;letter-spacing:.04em;color:#a9c0e8;margin-bottom:.5rem}
.masthead h1{font-size:1.5rem;font-weight:600;line-height:1.4;letter-spacing:-.01em}
.masthead .sub{margin-top:.9rem;padding-top:.9rem;border-top:1px solid rgba(255,255,255,.16);
  font-size:.93rem;color:#c5d6f0}

main{max-width:860px;margin:0 auto;padding:1.5rem 1.25rem 1rem}

/* ---- นับถอยหลัง ---- */
.clock{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.3rem 1.4rem;
  margin-bottom:1.1rem;box-shadow:0 1px 2px rgba(11,28,51,.05)}
.clock.urgent{border-color:#f0c3bd;background:linear-gradient(180deg,#fff 0%,var(--danger-bg) 100%)}
.clock .lab{font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  font-weight:600}
.clock .big{font-size:2rem;font-weight:700;letter-spacing:-.02em;margin:.25rem 0 .1rem;
  font-variant-numeric:tabular-nums}
.clock.urgent .big{color:var(--danger)}
.clock .when{color:var(--muted);font-size:.93rem}

/* ---- การ์ดรุ่น ---- */
.run{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.3rem 1.4rem;
  margin-bottom:1.1rem;box-shadow:0 1px 2px rgba(11,28,51,.05)}
.run-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;
  flex-wrap:wrap;margin-bottom:1rem}
.run h2{font-size:1.18rem;font-weight:600}
.run .meta{color:var(--muted);font-size:.9rem;margin-top:.15rem}
.pill{font-size:.78rem;font-weight:600;padding:.25rem .7rem;border-radius:999px;white-space:nowrap}
.pill.open{background:var(--ok-bg);color:var(--ok)}
.pill.shut{background:var(--silver);color:var(--muted)}
.pill.soon{background:var(--warn-bg);color:var(--warn)}

.headline{display:flex;align-items:baseline;gap:.5rem;margin-bottom:.55rem}
.headline .n{font-size:2.3rem;font-weight:700;color:var(--blue);line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.headline .of{color:var(--muted);font-size:1rem}

.bar{height:12px;border-radius:999px;background:var(--silver);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .c{background:linear-gradient(90deg,var(--blue) 0%,var(--blue-lt) 100%)}
.bar .d{background:var(--silver-2)}

.legend{display:flex;flex-wrap:wrap;gap:1.2rem;margin-top:.8rem}
.legend div{font-size:.9rem;color:var(--muted)}
.legend b{display:block;font-size:1.25rem;color:var(--ink);font-weight:600;
  font-variant-numeric:tabular-nums;line-height:1.3}
.legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:.35rem;
  vertical-align:middle}
.dot.c{background:var(--blue)} .dot.d{background:var(--silver-2)} .dot.p{background:#fff;
  border:2px solid var(--silver-2)}

details{margin-top:1rem;border-top:1px solid var(--line);padding-top:.8rem}
summary{cursor:pointer;font-size:.9rem;color:var(--blue);font-weight:500;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'▸ ';display:inline-block;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
table{width:100%;border-collapse:collapse;margin-top:.7rem;font-size:.92rem}
th,td{padding:.45rem .5rem;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:.84rem;white-space:nowrap}
td{font-variant-numeric:tabular-nums}
tr.done td{color:var(--ok)}
tr.done td:first-child::after{content:' ✓';font-weight:700}

.cta{background:linear-gradient(158deg,var(--navy) 0%,#13315f 100%);color:#fff;border-radius:16px;
  padding:1.4rem;margin-bottom:1.1rem;text-align:center}
.cta p{color:#c5d6f0;font-size:.95rem;margin-bottom:1rem}
.cta a{display:inline-block;background:#fff;color:var(--navy);text-decoration:none;
  font-weight:600;padding:.75rem 1.7rem;border-radius:10px;transition:transform .12s}
.cta a:hover{transform:translateY(-1px)}

/* ---- ตรวจสถานะของตนเอง ---- */
.check{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.3rem 1.4rem;
  margin-bottom:1.1rem;box-shadow:0 1px 2px rgba(11,28,51,.05)}
.check h2{font-size:1.1rem;font-weight:600;margin-bottom:.2rem}
.check .lede{color:var(--muted);font-size:.92rem;margin-bottom:1rem}
.f{display:grid;grid-template-columns:1fr 1fr auto;gap:.6rem;align-items:end}
.f label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.25rem}
.f input{width:100%;font-family:inherit;font-size:1rem;padding:.65rem .8rem;
  border:1.5px solid var(--line-2);border-radius:10px;background:#fff;color:var(--ink)}
.f input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--tint-2)}
.f button{font-family:inherit;font-size:1rem;font-weight:600;padding:.65rem 1.4rem;
  border:0;border-radius:10px;background:var(--blue);color:#fff;cursor:pointer;white-space:nowrap}
.f button:hover{background:var(--blue-dk)}
.f button:disabled{opacity:.6;cursor:default}
@media(max-width:620px){ .f{grid-template-columns:1fr} }

.res{margin-top:1rem;border-radius:0 10px 10px 0;padding:.9rem 1.1rem;border-left:3px solid;
  font-size:.95rem}
.res b{display:block;margin-bottom:.15rem}
.res.ok{border-color:var(--ok);background:var(--ok-bg)} .res.ok b{color:var(--ok)}
.res.wait{border-color:var(--warn);background:var(--warn-bg)} .res.wait b{color:var(--warn)}
.res.no{border-color:var(--danger);background:var(--danger-bg)} .res.no b{color:var(--danger)}
.res.info{border-color:var(--blue);background:var(--info-bg)} .res.info b{color:var(--navy)}
.res a{display:inline-block;margin-top:.6rem;background:var(--blue);color:#fff;text-decoration:none;
  font-weight:600;padding:.55rem 1.2rem;border-radius:9px;font-size:.95rem}

.note{border-left:3px solid var(--blue);background:var(--info-bg);padding:.85rem 1.05rem;
  border-radius:0 10px 10px 0;margin-bottom:1.1rem;font-size:.93rem}
.note.warn{border-left-color:var(--warn);background:var(--warn-bg)}
.note b{display:block;margin-bottom:.15rem;color:var(--navy)}

.state{text-align:center;padding:3rem 1rem;color:var(--muted)}
.spin{width:26px;height:26px;border:2.5px solid var(--silver);border-top-color:var(--blue);
  border-radius:50%;margin:0 auto 1rem;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

footer{max-width:860px;margin:0 auto;padding:.5rem 1.25rem 3rem;color:var(--muted);font-size:.85rem}
.upd{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center}
.upd button{background:none;border:1px solid var(--line-2);color:var(--muted);
  font-family:inherit;font-size:.82rem;padding:.3rem .8rem;border-radius:8px;cursor:pointer}
.upd button:hover{border-color:var(--blue);color:var(--blue)}
.hide{display:none}
@media(max-width:560px){
  .masthead h1{font-size:1.25rem}
  .headline .n{font-size:1.9rem}
  .clock .big{font-size:1.6rem}
  .legend{gap:.9rem}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="masthead">
  <div class="in">
    <div class="org">สำนักทันตสาธารณสุข กรมอนามัย กระทรวงสาธารณสุข</div>
    <h1>สถานะการยืนยันสิทธิ์เข้ารับการอบรม<br>ผู้นำด้านทันตกรรมป้องกันระดับปฐมภูมิ</h1>
    <div class="sub">แสดงเฉพาะจำนวนรวม ไม่เปิดเผยรายชื่อหรือข้อมูลส่วนบุคคล</div>
  </div>
</header>

<main>
  <div id="loading" class="state"><div class="spin"></div>กำลังโหลดข้อมูล…</div>
  <div id="fail" class="state hide"></div>
  <div id="body" class="hide"></div>
</main>

<footer>
  <div class="upd">
    <span id="updated"></span>
    <button onclick="load(true)">รีเฟรช</button>
  </div>
</footer>

<script>
var API = 'https://script.google.com/macros/s/AKfycbwPBlO9PrYNpMofFnwGE97JcHi2P87-UAf6-wI5IqvHOO72avFtef6mBatx6J1JEznqaw/exec';
var CONFIRM_URL = 'https://oralhealththailand-bd.github.io/PDL2026/confirm.html';

var DATA = null, TICK = null;
function $(id){ return document.getElementById(id); }
function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }
function n(x){ return Number(x||0).toLocaleString('th-TH'); }

/* ---------- ดึงข้อมูล ---------- */
function load(manual){
  if(manual){ $('body').classList.add('hide'); $('fail').classList.add('hide');
              $('loading').classList.remove('hide'); }
  fetch(API, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'confirmStats' })
  })
  .then(function(r){ return r.json(); })
  .then(function(res){
    if(!res || !res.ok) throw new Error(res && res.error ? res.error : 'ไม่สามารถอ่านข้อมูลได้');
    DATA = res; render();
  })
  .catch(function(e){
    $('loading').classList.add('hide');
    $('fail').classList.remove('hide');
    $('fail').innerHTML = 'เชื่อมต่อไม่สำเร็จ '+esc(e.message)+
      '<br><br><button onclick="load(true)" style="font-family:inherit;padding:.4rem 1rem;'+
      'border:1px solid #cfd7e4;border-radius:8px;background:#fff;cursor:pointer">ลองใหม่</button>';
  });
}

/* ---------- นับถอยหลัง ---------- */
function soonest(){
  var best=null;
  DATA.runs.forEach(function(r){
    if(!r.open || !r.closeIso) return;
    var t=new Date(r.closeIso).getTime();
    if(best===null || t<best.t) best={t:t, run:r};
  });
  return best;
}
function fmtLeft(ms){
  if(ms<=0) return 'หมดเวลาแล้ว';
  var s=Math.floor(ms/1000), d=Math.floor(s/86400), h=Math.floor(s%86400/3600),
      m=Math.floor(s%3600/60), ss=s%60;
  if(d>0) return d+' วัน '+h+' ชั่วโมง '+m+' นาที';
  if(h>0) return h+' ชั่วโมง '+m+' นาที '+ss+' วินาที';
  return m+' นาที '+ss+' วินาที';
}
function paintClock(){
  var b=soonest(); if(!b) return;
  var left=b.t-Date.now();
  var el=$('clockBig'); if(!el) return;
  el.textContent=fmtLeft(left);
  var box=$('clockBox');
  if(left < 48*3600*1000) box.classList.add('urgent'); else box.classList.remove('urgent');
}

/* ---------- วาดหน้า ---------- */
function render(){
  var h='';
  var b=soonest();
  if(b){
    h+='<div class="clock" id="clockBox">'+
       '<div class="lab">เหลือเวลายืนยันสิทธิ์</div>'+
       '<div class="big" id="clockBig">—</div>'+
       '<div class="when">ปิดรับ '+esc(b.run.closeText)+' เวลา 16.30 น.'+
       ' · หลังจากนี้ถือว่าสละสิทธิ์</div></div>';
  }

  var anyOpen=false, totPending=0;
  DATA.runs.forEach(function(r){ if(r.open){ anyOpen=true; totPending+=r.pending; } });

  if(anyOpen){
    h+='<div class="cta"><p>'+
       (totPending>0 ? 'ยังมีผู้มีสิทธิ์อีก <b>'+n(totPending)+' ท่าน</b> ที่ยังไม่ได้ยืนยัน'
                     : 'ยืนยันครบทุกท่านแล้ว ขอบคุณครับ')+
       '</p><a href="'+CONFIRM_URL+'">เข้าหน้ายืนยันสิทธิ์</a></div>';
  }

  h+='<div class="check">'+
     '<h2>ตรวจสถานะของท่าน</h2>'+
     '<div class="lede">กรอกเลขที่การสมัคร และอีเมลหรือเบอร์โทรศัพท์ที่เคยลงทะเบียนไว้ '+
     'เพื่อดูว่าท่านยืนยันสิทธิ์แล้วหรือยัง</div>'+
     '<div class="f">'+
     '<div><label for="mCode">เลขที่การสมัคร</label>'+
     '<input type="text" id="mCode" placeholder="PDL69-1-007" autocomplete="off"></div>'+
     '<div><label for="mVerify">อีเมลหรือเบอร์โทรศัพท์</label>'+
     '<input type="text" id="mVerify" placeholder="อีเมล หรือ 08xxxxxxxx" autocomplete="off"></div>'+
     '<button id="mBtn" onclick="checkMe()">ตรวจสอบ</button>'+
     '</div><div id="mRes"></div></div>';

  DATA.runs.forEach(function(r){ h+=runCard(r); });

  h+='<div class="note"><b>หน้านี้แสดงอะไรบ้าง</b>'+
     'ตัวเลขทั้งหมดเป็นยอดรวมของแต่ละรุ่นและแต่ละเขตสุขภาพ '+
     'ไม่มีการเปิดเผยชื่อ นามสกุล เลขที่การสมัคร หรือข้อมูลติดต่อของผู้ใด '+
     'หากต้องการตรวจสอบสถานะของตนเอง กรุณาเข้าหน้ายืนยันสิทธิ์แล้วกรอกเลขที่การสมัครของท่าน</div>';

  $('body').innerHTML=h;
  $('loading').classList.add('hide');
  $('fail').classList.add('hide');
  $('body').classList.remove('hide');
  $('updated').textContent='ข้อมูล ณ '+DATA.updated+' น.';

  paintClock();
  if(TICK) clearInterval(TICK);
  TICK=setInterval(paintClock,1000);

  ['mCode','mVerify'].forEach(function(id){
    $(id).addEventListener('keydown',function(e){ if(e.key==='Enter') checkMe(); });
  });
}

/* ---------- ตรวจสถานะของตนเอง ---------- */
function resBox(cls,title,body,link){
  $('mRes').innerHTML='<div class="res '+cls+'"><b>'+esc(title)+'</b>'+body+
    (link?'<br><a href="'+CONFIRM_URL+'">'+esc(link)+'</a>':'')+'</div>';
}
function checkMe(){
  var code=$('mCode').value.trim(), v=$('mVerify').value.trim();
  if(!code||!v){ return resBox('no','กรอกข้อมูลไม่ครบ',
    'กรุณากรอกทั้งเลขที่การสมัคร และอีเมลหรือเบอร์โทรศัพท์'); }

  var btn=$('mBtn'); btn.disabled=true; btn.textContent='กำลังตรวจ…';
  $('mRes').innerHTML='';

  fetch(API,{ method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'myStatus', code:code, verify:v }) })
  .then(function(r){ return r.json(); })
  .then(function(res){
    btn.disabled=false; btn.textContent='ตรวจสอบ';
    if(!res || !res.ok) return resBox('no','ตรวจสอบไม่สำเร็จ',
      esc(res && res.error ? res.error : 'ไม่สามารถอ่านข้อมูลได้'));

    var head=esc(res.code)+' · '+esc(res.runLabel)+
             (res.runDate?' · '+esc(res.runDate):'');

    if(res.state==='confirmed')
      return resBox('ok','ท่านยืนยันสิทธิ์เรียบร้อยแล้ว',
        head+(res.at?'<br>บันทึกเมื่อ '+esc(res.at)+' น.':'')+
        '<br>หากต้องการแก้ไขข้อมูล เข้าหน้ายืนยันสิทธิ์ได้จนถึง '+esc(res.closeText),
        res.open?'แก้ไขข้อมูลของฉัน':'');

    if(res.state==='declined')
      return resBox('info','ระบบบันทึกการสละสิทธิ์ของท่านแล้ว',
        head+(res.at?'<br>บันทึกเมื่อ '+esc(res.at)+' น.':'')+
        (res.open?'<br>หากเปลี่ยนใจ ยังกลับมายืนยันเข้าร่วมได้จนถึง '+esc(res.closeText)
                 :'<br>หากมีข้อสงสัย กรุณาติดต่อผู้ประสานงาน'),
        res.open?'กลับไปยืนยันเข้าร่วม':'');

    if(res.state==='notEligible')
      return resBox('info','ขอขอบคุณที่ให้ความสนใจ', esc(res.message));

    /* ยังไม่ยืนยัน */
    if(res.notOpen)
      return resBox('info','ยังไม่เปิดให้ยืนยันสิทธิ์', head+
        '<br>จะแจ้งกำหนดการให้ทราบทางอีเมล');
    if(!res.open)
      return resBox('no','หมดเขตยืนยันสิทธิ์แล้ว', head+
        '<br>ปิดรับเมื่อ '+esc(res.closeText)+' กรุณาติดต่อผู้ประสานงานโดยด่วน');

    resBox('wait','ท่านยังไม่ได้ยืนยันสิทธิ์', head+
      '<br>กรุณายืนยันภายใน '+esc(res.closeText)+' เวลา 16.30 น. '+
      'หากพ้นกำหนดจะถือว่าสละสิทธิ์', 'ยืนยันสิทธิ์ตอนนี้');
  })
  .catch(function(e){
    btn.disabled=false; btn.textContent='ตรวจสอบ';
    resBox('no','เชื่อมต่อไม่สำเร็จ', esc(e.message)+' กรุณาลองใหม่อีกครั้ง');
  });
}

function runCard(r){
  var pill = r.notOpen ? '<span class="pill shut">ยังไม่เปิดยืนยัน</span>'
           : (r.open   ? '<span class="pill open">เปิดให้ยืนยัน</span>'
                       : '<span class="pill shut">ปิดรับแล้ว</span>');

  var where = esc(r.place) + (r.city ? ' ' + esc(r.city) : '') +
              (r.venueTentative ? ' (ยังไม่สรุปโรงแรม)' : '');

  var h='<div class="run"><div class="run-top"><div>'+
        '<h2>'+esc(r.label)+'</h2>'+
        '<div class="meta">'+esc(r.date)+' · '+where+'</div>'+
        '</div>'+pill+'</div>';

  if(!r.eligible){
    h+='<div class="note warn" style="margin:0"><b>ยังไม่ได้ประกาศรายชื่อผู้มีสิทธิ์</b>'+
       'จะแจ้งให้ทราบทางเพจของสำนักทันตสาธารณสุข</div></div>';
    return h;
  }

  var pc = r.eligible ? Math.round(r.confirmed/r.eligible*100) : 0;
  var pd = r.eligible ? Math.round(r.declined /r.eligible*100) : 0;

  h+='<div class="headline"><span class="n">'+n(r.confirmed)+'</span>'+
     '<span class="of">ยืนยันแล้ว จากผู้มีสิทธิ์ '+n(r.eligible)+' ท่าน · '+pc+'%</span></div>'+
     '<div class="bar"><i class="c" style="width:'+pc+'%"></i>'+
     '<i class="d" style="width:'+pd+'%"></i></div>'+
     '<div class="legend">'+
     '<div><b>'+n(r.confirmed)+'</b><span class="dot c"></span>ยืนยันเข้าร่วม</div>'+
     '<div><b>'+n(r.pending)+'</b><span class="dot p"></span>ยังไม่ยืนยัน</div>'+
     '<div><b>'+n(r.declined)+'</b><span class="dot d"></span>สละสิทธิ์</div>'+
     '</div>';

  if(r.zones && r.zones.length){
    h+='<details><summary>ดูรายเขตสุขภาพ</summary><table>'+
       '<tr><th>เขตสุขภาพ</th><th>มีสิทธิ์</th><th>ยืนยัน</th><th>สละสิทธิ์</th><th>ยังไม่ยืนยัน</th></tr>';
    r.zones.forEach(function(z){
      var done = z.pending===0;
      h+='<tr'+(done?' class="done"':'')+'>'+
         '<td>'+(z.zone?('เขต '+z.zone):'ไม่ระบุ')+'</td>'+
         '<td>'+n(z.eligible)+'</td><td>'+n(z.confirmed)+'</td>'+
         '<td>'+n(z.declined)+'</td><td>'+n(z.pending)+'</td></tr>';
    });
    h+='</table></details>';
  }
  return h+'</div>';
}

load();
setInterval(function(){ load(false); }, 120000);
</script>
</body>
</html>
